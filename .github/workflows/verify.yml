name: Infrastructure verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Repository verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install hash-locked verification tools
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Install Terraform and Terragrunt (verified release checksums)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/iac-tools"
          cd "$RUNNER_TEMP/iac-tools"
          curl -fsSLO https://releases.hashicorp.com/terraform/1.15.2/terraform_1.15.2_linux_amd64.zip
          curl -fsSLO https://releases.hashicorp.com/terraform/1.15.2/terraform_1.15.2_SHA256SUMS
          awk '$2 == "terraform_1.15.2_linux_amd64.zip"' terraform_1.15.2_SHA256SUMS > terraform.sum
          test -s terraform.sum
          sha256sum -c terraform.sum
          unzip terraform_1.15.2_linux_amd64.zip terraform
          curl -fsSLO https://github.com/gruntwork-io/terragrunt/releases/download/v0.83.2/terragrunt_linux_amd64
          curl -fsSLO https://github.com/gruntwork-io/terragrunt/releases/download/v0.83.2/SHA256SUMS
          awk '$2 == "terragrunt_linux_amd64"' SHA256SUMS > terragrunt.sum
          test -s terragrunt.sum
          sha256sum -c terragrunt.sum
          mv terragrunt_linux_amd64 terragrunt
          chmod +x terraform terragrunt
          echo "$RUNNER_TEMP/iac-tools" >> "$GITHUB_PATH"
      - name: Choose verification base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-${PUSH_BASE:-origin/main}}"
          if [[ "$base" =~ ^0+$ ]]; then base=origin/main; fi
          echo "VERIFY_BASE_REF=$base" >> "$GITHUB_ENV"
      - name: Run non-destructive gates
        run: make verify
      - name: Validate affected Terraform modules without AWS credentials
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
          TF_IN_AUTOMATION: 'true'
        run: ./scripts/verify.sh --terraform-changed
